<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassFlow Feedback Responses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #171b24;
      --border: #2a3142;
      --text: #e8edf9;
      --muted: #92a0c2;
      --accent: #6c8aff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      background:
        radial-gradient(circle at top, rgba(108,138,255,0.16), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
    }
    .shell { max-width: 980px; margin: 0 auto; }
    h1 { font-family: "Syne", sans-serif; font-size: clamp(2rem, 4vw, 3.4rem); margin: 0 0 8px; }
    .subtitle { color: var(--muted); margin-bottom: 24px; }
    .grid { display: grid; gap: 14px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }
    .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .badge {
      display: inline-flex;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(108,138,255,0.14);
      color: #b9c9ff;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .muted { color: var(--muted); font-size: 0.88rem; }
    .empty {
      padding: 22px;
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1>Feedback Responses</h1>
    <p class="subtitle">Ideas, wishes, and bug reports submitted from the ClassFlow app.</p>
    <div id="feedback-list" class="grid">
      <div class="empty">Loading feedback...</div>
    </div>
  </main>
  <script type="module" src="js/feedback-responses.js"></script>

<!-- ===== PHANTOM LABS GROUP FOOTER ===== -->
<div style="
  background: #000;
  border-top: 1px solid rgba(57,255,20,.08);
  padding: 1.6rem 1.5rem;
  text-align: center;
  font-family: 'DM Sans', 'Rajdhani', sans-serif;
">
  <div style="
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    flex-wrap: wrap;
    justify-content: center;
  ">
    <span style="
      font-family: 'Rajdhani', sans-serif;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.22);
    ">This website is a part of</span>
    <a data-analytics="pl-group-link" href="https://phantomlabs.snproductions.us" target="_blank" rel="noopener noreferrer" style="
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      text-decoration: none;
      font-family: 'Rajdhani', sans-serif;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #39ff14;
      transition: text-shadow .3s, color .3s;
    " onmouseover="this.style.textShadow='0 0 12px rgba(57,255,20,.6)'" onmouseout="this.style.textShadow='none'">
      <svg width="14" height="14" viewBox="0 0 100 100" fill="none" style="flex-shrink:0;">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#39ff14" stroke-width="6" opacity=".5"/>
        <circle cx="50" cy="50" r="28" fill="#39ff14" opacity=".18"/>
        <circle cx="50" cy="50" r="12" fill="#39ff14" opacity=".5"/>
      </svg>
      Phantom Labs Group
      <span style="font-size:.6rem;opacity:.45;">↗</span>
    </a>
  </div>
</div>
<!-- ===== END PHANTOM LABS GROUP FOOTER ===== -->

<script>
  window.PL_ANALYTICS_SITE = {
    siteId: "classflow",
    siteName: "ClassFlow"
  };
</script>
<script type="module" src="pl-analytics.js"></script>
<!-- End Phantom Labs Analytics --></body>
</html>
